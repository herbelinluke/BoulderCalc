# Copy to paths.local.yaml and edit for your machine.
# paths.local.yaml is gitignored.
#
# Recommended layout (relative to project_root):
#   2024/  2025/  tiles/  segmentation/  BoulderCalc/

project_root: /path/to/reu
code_dir: BoulderCalc
segmentation_dir: segmentation

# Full-year orthos / DSMs (relative to project_root unless absolute)
ortho_24: 2024/Sites1and2_2024_Orthomosaic.tif
dsm_24: 2024/Sites1and2_2024_DSM_30mm.tif
ortho_25: 2025/25IniSouthOrt.tif
dsm_25: 2025/25IniSouthDSM.tif

# Optional sample tiles directory
tiles_dir: tiles

# Manual annotation GPKGs
annotations_24: segmentation/annotations/july14_24.gpkg
annotations_25: segmentation/annotations/july14_25.gpkg
